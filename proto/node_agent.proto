syntax = "proto3";

package node_agent;

// ──────────────────────────────────────
// 节点 Agent 服务
// ──────────────────────────────────────

service NodeAgent {
  // 心跳 / 健康检查
  rpc Ping(PingRequest) returns (PingResponse);

  // 采集节点完整信息
  rpc GetNodeInfo(GetNodeInfoRequest) returns (NodeInfo);

  // 执行任意 shell 命令
  rpc Exec(ExecRequest) returns (ExecResponse);

  // 下发关机指令
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);

  // 服务端推送事件流（状态变更、告警等）
  rpc WatchEvents(WatchRequest) returns (stream NodeEvent);

  // 启动 Docker 容器
  rpc DockerStart(DockerContainerRequest) returns (DockerContainerResponse);

  // 停止 Docker 容器
  rpc DockerStop(DockerContainerRequest) returns (DockerContainerResponse);

  // 启动 Docker Compose 堆栈
  rpc ComposeUp(DockerComposeRequest) returns (DockerComposeResponse);

  // 停止 Docker Compose 堆栈
  rpc ComposeDown(DockerComposeRequest) returns (DockerComposeResponse);

  // 获取 Docker 容器日志
  rpc DockerLogs(DockerLogsRequest) returns (DockerLogsResponse);

  // 部署模型服务 (根据规格启动 Docker 容器)
  rpc DeployModel(ModelDeploySpec) returns (ModelDeployResponse);

  // 停止/移除模型服务容器
  rpc UndeployModel(ModelDeploySpec) returns (ModelDeployResponse);
}

// 模型部署规格 —— 引用外部 docker-compose 文件 + 实例参数
message ModelDeploySpec {
  string name = 1;              // 模型/堆栈基础名 (compost project 基础名)
  string category = 2;          // chat / embedding / rerank / speech / image
  int32 index = 3;              // 实例序号 (从 1 开始); 0 表示单实例
  int32 port = 4;               // 本实例 host 端口
  repeated string gpu_devices = 5;    // 本实例 GPU 设备 ID，如 ["0"]
  string compose_yaml = 6;      // 外部 docker-compose 文件内容 (YAML 文本)
  map<string, string> env = 7;  // 注入到 docker compose 的环境变量
}

message ModelDeployResponse {
  bool success = 1;
  string message = 2;
  string container_id = 3;
}

// ──────────────────────────────────────
// 基础消息
// ──────────────────────────────────────

message PingRequest {
  string client_id = 1;
}

message PingResponse {
  bool alive = 1;
  string agent_version = 2;
  int64 uptime_seconds = 3;
  double load_1m = 4;
}

message GetNodeInfoRequest {}

// ──────────────────────────────────────
// 节点信息
// ──────────────────────────────────────

message NodeInfo {
  string hostname = 1;
  string os = 2;
  string cpu_model = 3;
  int32 cpu_cores = 4;
  string cpu_arch = 5;
  MemoryInfo memory = 6;
  repeated GpuInfo gpus = 7;
  repeated DiskInfo disks = 8;
  string uptime = 9;
  string load_avg = 10;
  string agent_version = 11;
  int64 uptime_seconds = 12;
  repeated ContainerInfo containers = 13;
  repeated StackInfo stacks = 14;
  repeated ModelInfo models = 15;
}

message ModelInfo {
  // 分类: chat / embedding / rerank / speech
  string category = 1;
  // 模型名称
  string name = 2;
  // 可用状态的运行实例
  repeated ModelInstance instances = 3;
}

message ModelInstance {
  string container_id = 1;
  string name = 2;
  string image = 3;
  string status = 4;
  // 服务地址 host:port
  string endpoint = 5;
  // 运行 GPU 设备 (如 0,1)
  string device = 6;
}

message ContainerInfo {
  string container_id = 1;
  string name = 2;
  string image = 3;
  string status = 4;
  string ports = 5;
}

message StackInfo {
  string project_name = 1;
  string status = 2;
  string config_files = 3;
  int32 container_count = 4;
  repeated StackContainerInfo containers = 5;
}

message StackContainerInfo {
  string container_id = 1;
  string name = 2;
  string image = 3;
  string status = 4;
  string ports = 5;
  string service_name = 6;
}

message MemoryInfo {
  string total = 1;
  string used = 2;
  string pct = 3;
}

message GpuInfo {
  string index = 1;
  string model = 2;
  string mem_used = 3;
  string mem_total = 4;
  string mem_util_pct = 5;
  string compute_util_pct = 6;
  string containers = 7;
}

message DiskInfo {
  string mount = 1;
  string total = 2;
  string used = 3;
  string avail = 4;
  string usage_pct = 5;
}

// ──────────────────────────────────────
// 命令执行
// ──────────────────────────────────────

message ExecRequest {
  string command = 1;
  int32 timeout_secs = 2;     // 0 表示不限
}

message ExecResponse {
  int32 exit_code = 1;
  string stdout = 2;
  string stderr = 3;
}

// ──────────────────────────────────────
// 关机
// ──────────────────────────────────────

message ShutdownRequest {
  string reason = 1;
  int32 delay_secs = 2;       // 延迟秒数
}

message ShutdownResponse {
  bool scheduled = 1;
  string message = 2;
}

// ──────────────────────────────────────
// Docker 容器管理
// ──────────────────────────────────────

message DockerContainerRequest {
  string container_id = 1;
}

message DockerContainerResponse {
  bool success = 1;
  string message = 2;
}

message DockerComposeRequest {
  string project_name = 1;
}

message DockerComposeResponse {
  bool success = 1;
  string message = 2;
}

message DockerLogsRequest {
  string container_id = 1;
  // 显示最近的行数，0 表示全部
  int32 tail = 2;
}

message DockerLogsResponse {
  bool success = 1;
  string logs = 2;
  string message = 3;
}

// ──────────────────────────────────────
// 事件推送
// ──────────────────────────────────────

message WatchRequest {
  // 订阅的事件类型，空列表表示全部
  repeated string event_types = 1;
}

message NodeEvent {
  string event_type = 1;      // "disk_high", "cpu_high", "memory_high", "heartbeat", "shutdown"
  string severity = 2;        // "info", "warn", "critical"
  string message = 3;
  int64 timestamp = 4;
  map<string, string> attributes = 5;
}
