[package]
name = "batch_shutdown"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "node_info"
path = "src/nodes/node_info.rs"

[[bin]]
name = "node-agent"
path = "src/agent/main.rs"

[dependencies]
chrono = "0.4"
dialoguer = "0.10"
ssh2 = "0.9.6"
openssl-sys = { version = "0.9", features = ["vendored"] }
serde = { version = "1.0", features = ["derive"] }
dirs = "5.0"
toml = "0.8"
ratatui = "0.29"
crossterm = "0.28"

# agent-server 依赖
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tokio-stream = "0.1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
serde_json = "1.0"

[build-dependencies]
tonic-build = "0.12"